[project]
name = "jigai"
version = "0.1.0"
description = "A small character-level GPT that writes Irish jigs in ABC notation: train, fine-tune, sample, score."
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.5.1", "numpy<2"]

[project.optional-dependencies]
modal = ["modal>=1.0"]
dev = ["pytest==8.3.3"]

[project.scripts]
jigai = "jigai.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jigai"]

[tool.setuptools.package-data]
jigai = ["player.html"]
